<title>Seed &amp; Sprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: "Dawn meadow". A painted watercolor dawn sky (lavender, blush, peach, a hint of sage) behind everything,
   petals and dandelion fluff drifting slowly, one pearly strip for Next / Score / Undo, a misty sage garden bed,
   pearly glowing tiles, and a Garden log of plants found so far. Single-theme by design, so every color is explicit. */
:root {
  color-scheme: light;
  --paper: #fbf6f1;
  --ink: #4a4157;
  --mist: #665d78;
  --accent: #7a6aa6;
  --cream: #fffaf7;
  --strip: rgba(255, 255, 255, 0.55);
  --strip-line: rgba(255, 255, 255, 0.82);
  --bed: radial-gradient(60% 45% at 30% 22%, rgba(240,246,234,0.85), rgba(240,246,234,0) 70%), radial-gradient(60% 45% at 75% 80%, rgba(190,208,182,0.6), rgba(190,208,182,0) 70%), linear-gradient(170deg, #d9e5d2 0%, #c4d4bc 100%);
  --slot: rgba(90, 120, 80, 0.10);
  --seed-wash: #faf3e6;
  --water-wash: #edf1fb;
  --tile-wash: #fffaf7;
  --tile-glow: 0 0 12px rgba(255,255,255,0.9), 0 2px 0 rgba(120,100,140,0.12);
  --pearl: rgba(255, 255, 255, 0.72);
  --pearl-glow: 0 0 14px rgba(255, 255, 255, 0.95);
  --halo: rgba(255, 240, 200, 0.9);
  --sparkle: #fff3c4;
  --gold: #e0b545;
  --gold-soft: #f6ead0;
  --line: rgba(122, 106, 166, 0.22);
  /* Boxes and buttons: cream with a thin lavender outline and a soft shadow, so they lift off the light page */
  --ring: inset 0 0 0 1.5px rgba(122,106,166,0.26), 0 3px 8px rgba(90,70,120,0.13);
  --label: #574e6a;
  --font-display: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --gap: 8px;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 32px;
  -webkit-tap-highlight-color: transparent;
}
/* Painted sky and drifting petals sit behind the game */
.sky, .drift { position: fixed; inset: 0; pointer-events: none; overflow: hidden; transform: translateZ(0); }
.sky { z-index: 0; }
.drift { z-index: 0; }
.sky .wash { position: absolute; filter: url(#wash); }
.sky .grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.16; mix-blend-mode: multiply; }
.petal { position: absolute; width: 9px; height: 6px; border-radius: 60% 40% 60% 40%; opacity: 0.85; animation: fall 10s linear infinite; will-change: transform, opacity; }
.fluff { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.95) 0 25%, rgba(255,255,255,0.35) 45%, rgba(255,255,255,0) 70%); animation: floaty 13s ease-in-out infinite; will-change: transform, opacity; }
@keyframes fall { 0% { transform: translate(0, -40px) rotate(0deg); opacity: 0 } 10% { opacity: 0.85 } 100% { transform: translate(-70px, 280px) rotate(220deg); opacity: 0 } }
@keyframes floaty { 0% { transform: translate(0, 0); opacity: 0 } 20% { opacity: 0.9 } 100% { transform: translate(40px, -80px); opacity: 0 } }
.wrap { position: relative; z-index: 1; max-width: 358px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.titlerow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.titlebtns { display: flex; gap: 6px; flex: none; }
.titlerow { position: relative; }
.sndpanel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; width: min(300px, 100%); box-sizing: border-box; padding: 16px 18px 18px;
  border-radius: 22px; background: rgba(255, 250, 247, 0.96); box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(90, 70, 120, 0.16), var(--pearl-glow);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 16px; }
.sndpanel h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--accent); }
.sndrow { display: flex; flex-direction: column; gap: 6px; }
.sndtop { display: flex; align-items: center; gap: 8px; }
.sndtop label { font-weight: 800; font-size: 14px; flex: 1; }
.sndval { font-size: 12px; color: var(--mist); font-variant-numeric: tabular-nums; }
.sndhint { font-size: 12px; color: var(--mist); }
.sndrow input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0; height: 24px; }
.sndrow.off input[type="range"], .sndrow.off .sndval { opacity: 0.4; }
.switch { position: relative; width: 46px; height: 28px; flex: none; border: none; border-radius: 999px; background: #d9d3e4; padding: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(60,40,90,0.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
/* Painted lettering: soft rounded letters filled with a lavender-to-rose watercolor wash */
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 9vw, 40px); line-height: 1.1; margin: 0; white-space: nowrap; min-width: 0; letter-spacing: 0.01em;
  color: var(--accent); background: linear-gradient(95deg, #8f7cc4 0%, #b58ab8 55%, #d49aa8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: url(#paint); }
.tagline { margin: 0; font-size: 13px; color: var(--mist); }

button { font-family: var(--font-body); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.round {
  position: relative; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: none;
  background: var(--cream); box-shadow: var(--ring); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none;
}
.round:disabled { opacity: 0.45; cursor: default; }
.badge {
  position: absolute; top: 1px; right: 1px; min-width: 16px; height: 16px; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; line-height: 16px; text-align: center;
}

.strip {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start;
  padding: 10px 12px 12px; border-radius: 18px; background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.8);
}
.lbl { font-size: 12px; letter-spacing: 0.02em; font-weight: 800; color: var(--label); }
/* Labels share one top row; the next tile, score and best sit right under them */
.next { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.mini { width: 52px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: var(--ring); }
.mini svg { width: 44px; height: 44px; }
.scores { display: flex; justify-content: center; align-items: flex-start; gap: 12px; min-width: 0; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.lbl { line-height: 1.2; }
.strip > #undo { align-self: end; }
/* Score and Best: matching boxes, the same height as the Next box */
.stat .num { min-width: 72px; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; background: var(--cream); box-shadow: var(--ring);
  display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .num.long { font-size: 20px; }
.divider { width: 1px; align-self: stretch; margin: 2px 0; background: var(--strip-line); }
.newbest {
  display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px;
  background: var(--gold-soft); color: #5a4310; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 0 12px rgba(255,236,180,0.8);
}

.board {
  position: relative; width: 100%; aspect-ratio: 5 / 6; max-width: 100%; touch-action: none; user-select: none;
}
.board .bg { position: absolute; inset: 0; border-radius: 28px; background: var(--bed); box-shadow: 0 10px 30px rgba(60,50,90,0.14); filter: url(#edge); }
.board.nudge { animation: nudge 0.22s; }
@keyframes nudge { 30% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }
.slots, .tiles { position: absolute; inset: 12px; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: var(--gap); }
.slot { border-radius: 14px; background: var(--slot); }

.tile {
  position: absolute; top: 0; left: 0;
  width: calc((100% - 3 * var(--gap)) / 4); height: calc((100% - 3 * var(--gap)) / 4);
  transform: translate(calc((var(--x) + var(--dx, 0)) * (100% + var(--gap))), calc((var(--y) + var(--dy, 0)) * (100% + var(--gap))));
  transition: transform var(--glide, 0.16s) cubic-bezier(0.25, 0.8, 0.35, 1), opacity 0.13s;
  z-index: 2;
  will-change: transform; /* keeps the watercolor art painted once, so moving a tile never repaints it */
}
.tiles.dragging .tile { transition: opacity 0.13s; }
.face { position: relative; width: 100%; height: 100%; box-sizing: border-box; padding-bottom: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.face .wash { position: absolute; inset: 0; border-radius: 14px; background: var(--w, var(--tile-wash)); box-shadow: var(--tile-glow); filter: url(#edge); }
.face.big .wash { box-shadow: var(--tile-glow), 0 0 0 3px var(--gold); }
.face svg { position: relative; width: 92%; height: auto; max-height: 74%; }
.face .name { position: relative; font-size: 9px; font-weight: 800; color: var(--ink); text-align: center; line-height: 1.1; padding: 0 3px; white-space: nowrap; letter-spacing: -0.01em; }
.tile.hint .wash { box-shadow: 0 0 0 3px var(--gold), var(--tile-glow); }
.tile.pop .face { animation: pop 0.2s ease-out; }
@keyframes pop { 50% { transform: scale(1.1); } }
.tile.gone { z-index: 1; opacity: 0; }

/* First time a plant is made this game: a breathing halo, a glowing outline and twinkling sparkles, timed with the harp */
.tile.first { z-index: 3; }
.tile .halo { position: absolute; inset: -26px; border-radius: 40px; background: radial-gradient(closest-side, var(--halo) 35%, rgba(255,255,255,0)); animation: breathe 1.6s ease-in-out 2; pointer-events: none; }
.tile.first .wash { box-shadow: 0 0 0 2px var(--halo), 0 0 22px var(--halo); }
.tile .spk { position: absolute; pointer-events: none; animation: twinkle 1.2s ease-in-out 3; }
@keyframes breathe { 0%, 100% { opacity: 0.55; transform: scale(0.95) } 50% { opacity: 1; transform: scale(1.04) } }
@keyframes twinkle { 0%, 100% { transform: scale(0.3); opacity: 0 } 50% { transform: scale(1); opacity: 1 } }
.toast {
  position: absolute; left: 50%; bottom: -14px; transform: translate(-50%, 6px); z-index: 4; padding: 6px 14px; border-radius: 999px;
  background: var(--pearl); box-shadow: var(--pearl-glow); color: var(--accent); font-size: 12px; font-weight: 800; white-space: nowrap;
  opacity: 0; transition: opacity 0.4s, transform 0.4s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.overlay {
  position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 24px; background: rgba(251, 246, 241, 0.9); border-radius: 28px; color: var(--ink);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.overlay h2 { font-family: var(--font-display); font-weight: 600; font-size: 32px; line-height: 1.1; margin: 0;
  color: var(--accent); background: linear-gradient(95deg, #8f7cc4 0%, #b58ab8 55%, #d49aa8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: url(#paint); }
.overlay p { margin: 0; color: var(--mist); max-width: 30ch; line-height: 1.45; }
.overlay .stats { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-radius: 16px; background: var(--cream); box-shadow: var(--tile-glow); min-width: 220px; }
.overlay .stats div { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; }
.overlay .stats b { color: var(--ink); }
.overlay .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.pill { min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 800; border: 1px solid var(--strip-line); background: var(--pearl); box-shadow: var(--pearl-glow); color: var(--ink); }
.pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(122,106,166,0.35); }

.rules { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--mist); }
.rules b { color: var(--ink); }

/* Garden log: a little journal page on light grid paper, listing every plant you've ever grown in growing order */
.log { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; padding: 22px 18px; border-radius: 18px;
  background-color: #fffdf8; background-image: linear-gradient(rgba(122,106,166,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(122,106,166,0.09) 1px, transparent 1px);
  background-size: 14px 14px; background-position: -1px -1px;
  box-shadow: 0 1px 0 rgba(120,100,140,0.10), 0 8px 22px rgba(90,70,120,0.10), 0 0 0 1px rgba(122,106,166,0.10); }
.loghead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding-bottom: 10px; border-bottom: 1.5px solid rgba(242,160,180,0.45); }
.loghead h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.1; color: var(--accent); }
.loghead p { margin: 2px 0 0; font-size: 12px; color: var(--mist); }
.loghead > span { font-size: 12px; font-weight: 800; color: var(--mist); white-space: nowrap; }
.chain { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; column-gap: 10px; }
.link { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 0; }
.link .dot { width: 54px; height: 54px; flex: none; border-radius: 50%; overflow: hidden; background: var(--cream); box-shadow: 0 0 10px rgba(255,255,255,0.9), inset 0 0 0 1px rgba(122,106,166,0.16); display: flex; align-items: center; justify-content: center; }
.link .dot svg { width: 54px; height: 54px; }
.link b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.link small { display: block; font-size: 11px; line-height: 1.3; color: var(--mist); }
.link > div:last-child { min-width: 0; }
.link.fresh b { color: var(--accent); }
.proto { font-size: 11px; color: var(--mist); margin: 0; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .tile.pop .face, .board.nudge, .petal, .fluff, .tile .halo, .tile .spk { animation: none; }
  .petal, .fluff { display: none; }
}
</style>
</head>

    <button class="round" id="restart" type="button" aria-label="New game"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
    </div>
    <div class="sndpanel" id="sndPanel" role="dialog" aria-label="Sound settings" hidden>
      <h3>Sound</h3>
      <div class="sndrow">
        <div class="sndtop"><label for="fxVol">Sound Effects</label><span class="sndval" id="fxVal">50%</span><button class="switch" id="fxOn" type="button" role="switch" aria-checked="true" aria-label="Sound effects"></button></div>

      if (el.dataset.v != t.v) { face(el._face, t.v); el.dataset.v = t.v; }
      el.style.setProperty("--x", x); el.style.setProperty("--y", y);
      if (fx.popped && fx.popped.includes(t.id)) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    });
    for (const [id, el] of els) {
      if (!present.has(id)) { els.delete(id); el.classList.add("gone"); setTimeout(() => el.remove(), 160); }
    }

    const sc = scoreOf(S.grid);
    animateScore(sc);
    sfx.music(stageOf(S.biggest), S.grid.filter(t => !t).length <= 3, S.over);
    if (sc > best) { best = sc; store.set("ss-best", best); }
    const isNewBest = sc > S.startBest && S.startBest > 0;
    if (isNewBest && !S.cheered) { S.cheered = true; sfx.best(); }
    $("best").textContent = fmtBest(best); $("best").classList.toggle("long", fmtBest(best).length > 5);

    const n1 = $("next1");
    n1.style.background = wash(S.queue[0]); n1.innerHTML = svgFit(S.queue[0], 0.5); n1.title = plant(S.queue[0])[1];
    n1.setAttribute("aria-label", "Next: " + plant(S.queue[0])[1]);

    $("undoCount").textContent = S.undos;
    $("undo").setAttribute("aria-label", `Undo, ${S.undos} left`);
    $("undo").disabled = !S.undos || !S.history.length;

    // Growing order, reading down the left column, then down the right
    const found = [2, 1, ...CHAIN.slice(2)].filter(v => discovered.includes(v));
    $("foundCount").textContent = `${found.length} Found`;
    const chainEl = $("chain"); chainEl.style.gridTemplateRows = `repeat(${Math.max(1, Math.ceil(found.length / 2))}, auto)`;
    const logKey = found.join() + "|" + S.newFinds.join();
    if (chainEl.dataset.key !== logKey) {
      chainEl.dataset.key = logKey;
      chainEl.innerHTML = found.map(v => `<div class="link${S.newFinds.includes(v) ? " fresh" : ""}"><div class="dot">${svgFit(v, 0.58)}</div><div><b>${plant(v)[1]}</b><small>${recipe(v)}</small></div></div>`).join("");
    }
    if (!S.over) overlay.hidden = true;
  }
  function fullRender() { tilesEl.innerHTML = ""; els.clear(); render(); }

  function showOver() {
    const sc = scoreOf(S.grid), canRescue = !S.rescueUsed;
    const finds = S.newFinds.length ? S.newFinds.map(v => plant(v)[1]).join(", ") : "None This Time";
    overlay.innerHTML = `<h2>The Garden Is Full!</h2>
      <div class="stats">
        <div><span>Score</span><b>${fmt(sc)}${sc > S.startBest && S.startBest > 0 ? " · New Best!" : ""}</b></div>
        <div><span>Biggest Plant</span><b>${plant(S.biggest)[1]}</b></div>
        <div><span>New Plants Found</span><b>${finds}</b></div>
      </div>
      ${canRescue ? "<p>Pull some weeds to clear three small tiles and keep growing. You can do this once per game.</p>" : ""}
      <div class="btns">
        ${canRescue ? '<button class="pill primary" id="rescue" type="button">Pull Weeds</button>' : ""}
        ${S.undos && S.history.length ? '<button class="pill" id="ovUndo" type="button">Undo a Move</button>' : ""}
        <button class="pill ${canRescue ? "" : "primary"}" id="again" type="button">Play Again</button>
      </div>`;
    overlay.hidden = false;
    sfx.over(); sfx.music(stageOf(S.biggest), true, true);
    $("again").onclick = () => { newGame(); sfx.start(); };
    if (canRescue) $("rescue").onclick = rescue;
    const u = $("ovUndo"); if (u) u.onclick = undo;
  }

  function confirmNew() {
    if (S.over) { newGame(); return; }
    overlay.innerHTML = `<h2>Start Over?</h2><p>Your current garden will be cleared. Your best score and Garden Log stay.</p>
      <div class="btns"><button class="pill primary" id="yesNew" type="button">Start Over</button><button class="pill" id="noNew" type="button">Keep Playing</button></div>`;
    overlay.hidden = false;
    $("yesNew").onclick = () => { newGame(); sfx.start(); };
    $("noNew").onclick = () => { overlay.hidden = true; };
  }

  function rescue() {
    S.rescueUsed = true;
    S.grid.map((t, i) => [t, i]).filter(([t]) => t).sort((a, b) => a[0].v - b[0].v).slice(0, 3)
      .forEach(([, i]) => { S.grid[i] = null; });
    S.over = false; overlay.hidden = true; render(); sfx.place();
  }

  function undo() {
    if (!S.undos || !S.history.length) return;
    Object.assign(S, S.history.pop()); S.undos--; S.over = false;
    fullRender(); sfx.undo();
  }

  $("undo").onclick = undo;
  $("restart").onclick = confirmNew;
  // Sound settings panel: on/off and volume for sound effects and for music, saved in this browser
  const panel = $("sndPanel"), sndBtn = $("sound");
  function paintSound() {
    const fxOn = sfx.on, muOn = sfx.musicOn, any = fxOn || muOn;
    $("soundOn").hidden = !any; $("soundOff").hidden = any;
    $("fxOn").setAttribute("aria-checked", String(fxOn)); $("muOn").setAttribute("aria-checked", String(muOn));
    $("fxVol").value = sfx.fxVol; $("muVol").value = sfx.musicVol;
    $("fxVal").textContent = sfx.fxVol + "%"; $("muVal").textContent = sfx.musicVol + "%";
    $("fxOn").closest(".sndrow").classList.toggle("off", !fxOn); $("muOn").closest(".sndrow").classList.toggle("off", !muOn);
  }
  function openPanel(open) { panel.hidden = !open; sndBtn.setAttribute("aria-expanded", String(open)); }
  sndBtn.onclick = e => { e.stopPropagation(); openPanel(panel.hidden); };
  document.addEventListener("pointerdown", e => { if (!panel.hidden && !panel.contains(e.target) && !sndBtn.contains(e.target)) openPanel(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) { openPanel(false); sndBtn.focus(); } }, true);
  $("fxOn").onclick = () => { sfx.setFx(!sfx.on, sfx.fxVol); paintSound(); sfx.preview(); };
  $("muOn").onclick = () => { sfx.setMusic(!sfx.musicOn, sfx.musicVol); paintSound(); };
  // Moving a slider turns that part back on if it was off
  $("fxVol").oninput = e => { sfx.setFx(true, +e.target.value); paintSound(); };
  $("fxVol").onchange = () => sfx.preview();
  $("muVol").oninput = e => { sfx.setMusic(true, +e.target.value); paintSound(); };
  paintSound();
  // Browsers only allow sound after the first tap or key press
  ["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, () => sfx.unlock(), { once: true }));

  const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down" };
  document.addEventListener("keydown", e => { const d = KEYS[e.key]; if (!d || !overlay.hidden || !panel.hidden || e.target.closest("input, .sndpanel")) return; e.preventDefault(); move(d); });

  // Drag to preview: tiles follow your finger, and pairs that will combine light up.
  // Let go past halfway (or flick) to make the move; drag back to cancel.
  const VEC = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
  let drag = null;
  // What each tile was last given, so a drag frame only touches tiles that change
  const shown = new Map();
  function apply(want) {
    for (const [id, el] of els) {
      const w = want.get(id), prev = shown.get(id);
      const dx = w ? w.dx : 0, dy = w ? w.dy : 0, hint = !!(w && w.hint);
      if (prev && prev.dx === dx && prev.dy === dy && prev.hint === hint) continue;
      if (dx || dy) { el.style.setProperty("--dx", dx); el.style.setProperty("--dy", dy); } else { el.style.removeProperty("--dx"); el.style.removeProperty("--dy"); }
      if (!prev || prev.hint !== hint) el.classList.toggle("hint", hint);
      shown.set(id, { dx, dy, hint });
    }
  }
  function resetOffsets() { apply(new Map()); shown.clear(); }
  function preview(dir, f) {
    const want = new Map(), g = S.grid;
    if (canMove(g, dir)) {
      const [vx, vy] = VEC[dir], d = Math.round(f * 100) / 100;
      for (const l of lines(dir)) {
        const s = lineStart(g, l); if (s < 0) continue;
        for (let j = s; j < N; j++) { const t = g[l[j]]; if (t) want.set(t.id, { dx: vx * d, dy: vy * d }); }
        const a = g[l[s - 1]], b = g[l[s]];
        if (a && b && f > 0.15) { (want.get(a.id) || want.set(a.id, { dx: 0, dy: 0 }).get(a.id)).hint = true; want.get(b.id).hint = true; }
      }
    }
    apply(want);
  }
  let frame = 0, glideTimer = 0;
  function schedule() {
    if (frame) return;
    frame = requestAnimationFrame(() => { frame = 0; if (drag && drag.dir) preview(drag.dir, drag.f); });
  }
  boardEl.addEventListener("pointerdown", e => {
    if (S.over || !overlay.hidden || e.target.closest("button")) return;
    drag = { x: e.clientX, y: e.clientY, t: performance.now(), dir: null, f: 0, dist: 0 };
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  });
  boardEl.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 6) { if (drag.dir) { drag.dir = null; drag.f = 0; resetOffsets(); } return; }
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    const dist = Math.max(Math.abs(dx), Math.abs(dy));
    const cell = (dir === "left" || dir === "right" ? tilesEl.clientWidth : tilesEl.clientHeight) / N;
    if (drag.dir && drag.dir !== dir) resetOffsets();
    drag.dir = dir; drag.dist = dist; drag.f = Math.min(1, dist / cell);
    tilesEl.classList.add("dragging");
    schedule();
  });
  function endDrag(cancel) {
    if (!drag) return;
    const { dir, f, dist, t } = drag; drag = null;
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    const flick = dist > 24 && performance.now() - t < 220;
    const commit = !cancel && dir && (f >= 0.5 || flick) && canMove(S.grid, dir);
    if (!commit) {
      // Let go early: glide back from wherever the finger left the tiles
      tilesEl.classList.remove("dragging"); void tilesEl.offsetWidth;
      resetOffsets();
      if (!cancel && dir && (f >= 0.5 || flick)) move(dir); // blocked move: just the gentle nudge
      return;
    }
    // Commit: note where every tile is drawn right now, make the move with motion paused,
    // then offset each tile so it still sits exactly there, and let it glide the rest of the way.
    const num = (el, k) => parseFloat(el.style.getPropertyValue(k)) || 0;
    const at = new Map();
    for (const [id, el] of els) at.set(id, [num(el, "--x") + num(el, "--dx"), num(el, "--y") + num(el, "--dy")]);
    shown.clear();
    move(dir);
    for (const [id, el] of els) {
      const p = at.get(id); if (!p) continue;
      el.style.setProperty("--dx", p[0] - num(el, "--x")); el.style.setProperty("--dy", p[1] - num(el, "--y"));
    }
    // The less of the way left to go, the shorter the glide
    tilesEl.style.setProperty("--glide", (0.08 + 0.14 * (1 - Math.min(1, f))).toFixed(3) + "s");
    clearTimeout(glideTimer); glideTimer = setTimeout(() => tilesEl.style.removeProperty("--glide"), 400);
    void tilesEl.offsetWidth;
    tilesEl.classList.remove("dragging"); void tilesEl.offsetWidth;
    for (const el of els.values()) { el.style.removeProperty("--dx"); el.style.removeProperty("--dy"); el.classList.remove("hint"); }
  }
  boardEl.addEventListener("pointerup", () => endDrag(false));
  boardEl.addEventListener("pointercancel", () => endDrag(true));

  // ---------- Painted dawn sky and drifting petals ----------
  (function paintSky() {
    const sky = $("sky"), drift = $("drift");
    // left, top, width, height (in % of the screen), color, opacity, rounded shape
    // Fewer, paler washes so the sky stays calm behind the board
    const washes = [
      [-22, -8, 80, 28, "#cbb9e8", 0.22, "48% 52% 58% 42% / 50% 44% 56% 50%"],
      [42, -9, 76, 30, "#f2b9c9", 0.20, "55% 45% 40% 60% / 45% 55% 45% 55%"],
      [-18, 40, 64, 30, "#f6d3c0", 0.16, "45% 55% 55% 45% / 50% 50% 50% 50%"],
      [56, 46, 60, 30, "#d8c8ef", 0.18, "58% 42% 50% 50% / 46% 54% 46% 54%"],
      [8, 74, 90, 30, "#d3e3c6", 0.20, "44% 56% 56% 44% / 50% 50% 50% 50%"],
      [70, -13, 50, 30, "#fff0ec", 0.7, "50%"]
    ];
    sky.innerHTML = washes.map(([l, t, w, h, c, o, r]) =>
      `<div class="wash" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%;border-radius:${r};background:${c};opacity:${o}"></div>`).join("") +
      '<svg class="grain"><rect width="100%" height="100%" filter="url(#grain)"/></svg>';
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let html = "";
    for (let i = 0; i < 10; i++) html += `<span class="petal" style="left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 95 - 5).toFixed(1)}%;animation-delay:-${(rnd() * 10).toFixed(1)}s;background:${["#f4c3cf", "#f7cdd5", "#fde2e6"][i % 3]}"></span>`;
    for (let i = 0; i < 6; i++) html += `<span class="fluff" style="left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 95).toFixed(1)}%;animation-delay:-${(rnd() * 13).toFixed(1)}s"></span>`;
    drift.innerHTML = html;
  })();

  // ---------- First-time glow on the tile, timed with the harp ----------
  const SPARK = '<svg viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0 Z" fill="currentColor"/></svg>';
  let toastTimer = 0;
  function celebrate(id, v) {
    const el = els.get(id); if (!el) return;
    el.classList.add("first");
    const bits = [[-10, -12, 20, 0], [64, -2, 15, 0.35], [68, 76, 17, 0.7], [-12, 68, 13, 1.0], [28, -20, 12, 1.3]]
      .map(([x, y, sz, d]) => `<span class="spk" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;color:var(--sparkle);animation-delay:${d}s">${SPARK}</span>`).join("");
    el.insertAdjacentHTML("afterbegin", '<span class="halo"></span>');
    el.insertAdjacentHTML("beforeend", bits);
    setTimeout(() => { el.classList.remove("first"); el.querySelectorAll(".halo, .spk").forEach(n => n.remove()); }, 3400);
    const t = $("toast"); t.textContent = `First ${plant(v)[1]} This Game`; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function boot(data) {
    if (data && data.S && data.S.grid && "biggest" in data.S) {
      S = data.S; S.firsts = S.firsts || []; nextId = data.nextId || 1000; shownScore = 0; fullRender(); if (S.over) showOver();
    } else newGame();
  }
  window.claude?.hot?.snapshot?.(() => ({ S, nextId }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
